<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: browser popup</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="sheet.css">
<style>
  /* Popup layout: 360 wide, 16px side gutter, content column 328. Height follows content, budget 520. */
  .popup { width: 360px; display: flex; flex-direction: column; }
  .popup > header { display: flex; align-items: center; gap: var(--s2); height: 48px; padding: 0 var(--s4); }
  .popup > header .site { font-family: var(--font-mono); font-weight: var(--w-strong); font-size: var(--t-body); min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; }
  .popup > header .status { flex: none; font-size: var(--t-caption); }
  .popup .tabs { padding: 0 var(--s4); }
  .popup main { padding: var(--s5) var(--s4) var(--s4); display: flex; flex-direction: column; }
  .focal .label { color: var(--muted); margin-top: var(--s1); }
  .facts { margin-top: var(--s5); }
  .facts .value { font-size: var(--t-title); line-height: var(--lh-title); }
  .control { margin-top: var(--s6); display: flex; flex-direction: column; gap: var(--s2); }
  .control .head { display: flex; align-items: center; justify-content: space-between; min-height: var(--hit); }
  .control .head h2 { font-size: var(--t-body); font-weight: var(--w-strong); }
  .foot { margin-top: var(--s4); display: flex; justify-content: space-between; align-items: center; min-height: var(--hit); }
  .foot .t-caption { color: var(--muted); }
  /* Second level */
  .group + .group { margin-top: var(--s5); }
  .group > h2 { display: flex; justify-content: space-between; font-size: var(--t-body); font-weight: var(--w-strong); padding-bottom: var(--s1); }
  .group > h2 .num { font-weight: var(--w-regular); color: var(--muted); }
  .popup .row { grid-template-columns: minmax(0, 1fr) auto; min-height: 48px; }
  .url .path { color: var(--muted); }
  .scroll { max-height: 436px; overflow: hidden; }
  .tools { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .provenance .row { min-height: 40px; }
  .callout { margin-top: var(--s4); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .callout p { color: var(--ink); }
  .callout strong { color: var(--state); }
</style>
</head>
<body>
<div class="sheet">

<!-- 1. Main view, common case -->
<figure><figcaption>Main · protected · 360 wide</figcaption>
<section class="frame popup" data-name="popup-main">
  <header>
    <span class="mark" aria-hidden="true"></span>
    <span class="site" title="publisher.example">publisher.example</span>
    <span class="status" data-state="protected"><span class="dot"></span><span class="word">Protected</span></span>
  </header>
  <nav class="tabs" aria-label="Popup sections">
    <a href="#" aria-current="page">This page</a>
    <a href="#">Blocked <span class="count">5</span></a>
    <a href="#">Rules <span class="count">1</span></a>
    <a href="#">Settings</a>
  </nav>
  <main>
    <div class="metric focal">
      <span class="value t-display">5</span>
      <span class="label t-body" style="font-size:var(--t-body);line-height:var(--lh-body)">requests blocked on this page</span>
    </div>
    <div class="metric-row facts">
      <div class="metric"><span class="value">11</span><span class="label">links cleaned</span></div>
      <div class="metric"><span class="value">0</span><span class="label">cookies removed</span></div>
      <div class="metric"><span class="value">2</span><span class="label">elements hidden</span></div>
    </div>
    <div class="control">
      <div class="head"><h2 id="lvl">Protection on this site</h2><button class="btn quiet">Pause</button></div>
      <div class="seg" role="group" aria-labelledby="lvl">
        <button aria-pressed="false" title="Host lists only">Relaxed</button>
        <button aria-pressed="true" title="Host lists plus URL filters (default)">Standard</button>
        <button aria-pressed="false" title="Also holds embeds and third-party frames">Strict</button>
        <button aria-pressed="false" title="Also blocks all scripts on this site">No scripts</button>
      </div>
    </div>
  </main>
</section></figure>
