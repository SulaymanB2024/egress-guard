<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before: click-to-load placeholder (v0.5.0)</title>
<!-- Reproduction of the v0.5.0 placeholder for the before capture: the style and text are copied verbatim from
     browser/page-guard.js placeholder() (shadow-root CSS inlined here without the !important guards). -->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../mockups/sheet.css">
<style>
  .host-page { padding: 24px; background: #fff; color: #222; font: 16px/1.6 Georgia, serif; }
  @media (prefers-color-scheme: dark) { .host-page { background: #1c1c1e; color: #ddd; } }
  .b{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;box-sizing:border-box;min-height:120px;padding:16px;border:1px dashed #8a948c;border-radius:8px;background:#f4f4f0;color:#1b1f1d;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;margin:8px 0}
  .t{font-weight:650}.n{color:#4d5650;font-size:12.5px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
  .b button{font:inherit;font-weight:600;border:1px solid #2f6f58;border-radius:6px;padding:6px 12px;color:#fff;background:#19382e;cursor:pointer;min-width:24px;min-height:24px}
  .b button.c{background:transparent;color:#2f6f58;border-color:transparent;text-decoration:underline;text-underline-offset:3px;font-weight:500;padding:6px 4px}
  @media (prefers-color-scheme:dark){.b{background:#1d2421;color:#e8ece9;border-color:#5b665f}.n{color:#a9b3ad}.b button.c{color:#8fc9ac}}
</style>
</head>
<body>
<div class="sheet">
<figure><figcaption>Before · video slot</figcaption>
<section class="frame host-page" data-name="placeholder-video" style="width:688px">
  <p>The council approved the plan on Tuesday after a long session. Watch the full meeting below.</p>
  <div class="b" style="min-height:360px"><span class="t">YouTube content held</span><span class="n">Loading it lets YouTube see this visit, without its cookies. Held by Egress Guard (Strict).</span><div class="row"><button>Load from YouTube</button><button class="c">Load with cookies (signed in)</button></div></div>
  <p>Residents can comment until December 4.</p>
</section></figure>
<figure><figcaption>Before · narrow slot</figcaption>
<section class="frame host-page" data-name="placeholder-narrow" style="width:348px">
  <div class="b" style="min-height:250px"><span class="t">Instagram content held</span><span class="n">Loading it lets Instagram see this visit, without its cookies. Held by Egress Guard (Strict).</span><div class="row"><button>Load from Instagram</button><button class="c">Load with cookies (signed in)</button></div></div>
</section></figure>
</div>
</body>
</html>
