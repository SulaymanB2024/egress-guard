<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked: possible malware or phishing</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="warning.css">
</head>
<body>
<header class="bar"><span class="mark" aria-hidden="true"></span>Egress Guard</header>
<main class="page" data-state="threat" aria-labelledby="title">
  <p class="kind"><span class="dot" aria-hidden="true"></span>Blocked before loading</p>
  <h1 id="title" class="t-headline">This site is on a malware and phishing list</h1>
  <div class="dest">
    <p class="h t-title"><span class="host" id="host">…</span></p>
    <p class="url t-caption"><span class="host" id="url"></span></p>
  </div>
  <dl class="facts">
    <dt>List</dt><dd id="list">Malware and phishing</dd>
    <dt>Updated</dt><dd id="updated" class="num">Unknown</dd>
  </dl>
  <p class="said">Your browser did not contact this site.</p>
  <div class="actions">
    <button id="back" class="btn primary lg" type="button" autofocus>Go back</button>
    <button id="reveal" class="btn quiet" type="button" aria-expanded="false" aria-controls="confirm">Continue anyway…</button>
  </div>
  <div id="confirm" class="confirm callout" hidden>
    <p>Opens this site once, in this tab, for up to <span id="minutes">10</span> minutes. Ads and trackers stay blocked.</p>
    <button id="continue" class="btn" type="button">Open this site once</button>
  </div>
  <p id="error" class="inline-error" role="alert" hidden></p>
</main>
<script src="core/hosts.js"></script>
<script src="core/links.js"></script>
<script src="core/params.js"></script>
<script src="core/dnr.js"></script>
<script src="warning.js"></script>
</body>
</html>
