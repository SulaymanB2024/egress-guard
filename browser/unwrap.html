<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Opening link…</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="warning.css">
<link rel="stylesheet" href="unwrap.css">
</head>
<body>
<header class="bar"><span class="mark" aria-hidden="true"></span>Egress Guard</header>

<main class="page scan" data-state="neutral" data-optical aria-labelledby="scan-title" id="scan" hidden>
  <p class="kind"><span class="dot" id="scan-dot" aria-hidden="true" hidden></span><span id="scan-eyebrow">Mail scanner link</span></p>
  <h1 id="scan-title" class="t-display">Open this link through your mail scanner?</h1>
  <div class="dest">
    <p class="label">It leads to</p>
    <p class="h"><span class="host" id="scan-host">…</span></p>
    <p class="url t-caption"><span class="host" id="scan-url"></span></p>
  </div>
  <p class="said" id="scan-idn" hidden></p>
  <p class="said" id="scan-body" hidden></p>
  <div class="actions">
    <button id="through" class="btn primary lg" type="button">Continue through the scanner</button>
    <button id="direct" class="btn lg" type="button" aria-label="Open directly (skips the mail scan)" title="Skips the mail scanner's click-time check. Malware and phishing blocking still applies.">Open directly</button>
  </div>
  <p id="scan-error" class="inline-error" role="alert" hidden></p>
</main>

<main class="page unwrap" data-state="neutral" data-optical aria-labelledby="title" id="card" hidden>
  <p class="kind">Link tracker skipped</p>
  <h1 id="title" class="t-display">This link's destination couldn't be read</h1>
  <div class="dest">
    <p class="label">The link was</p>
    <p class="h full"><span class="host" id="url"></span></p>
  </div>
  <p class="said">Egress Guard did not contact the tracker.</p>
  <p class="reason muted" id="reason"></p>
  <div class="actions">
    <button id="back" class="btn primary lg" type="button">Go back</button>
    <button id="copy" class="btn quiet" type="button">Copy link</button>
  </div>
</main>
<script src="core/links.js"></script>
<script src="unwrap.js"></script>
</body>
</html>
