[proxy]
port = 18080
dashboard_port = 18081

[block]
list_tier = "pro.plus"
# HaGeZi Threat Intelligence: "full" (default, about 1.2 million names) or "medium".
# URLhaus malware hosts and Phishing Army phishing domains are always on.
threat_tier = "full"
cname_protection = true
# Block known DNS-over-HTTPS servers, so applications fall back to the system resolver
# instead of resolving privately and connecting by IP address. Browsers fall back on failure.
block_encrypted_dns = true
hosts = []
allow = []
# Exact hosts that skip tracker and CNAME decisions. Strict default: none.
# Threat and manual block rules still apply to every exempted host.
dashboard_hosts = []
# Opt-in compatibility preset. ["analytics-dashboards"] exempts the analytics
# reporting consoles analytics.google.com, clarity.microsoft.com,
# claritystatic.azureedge.net, app.posthog.com, us.posthog.com and
# eu.posthog.com, so their web dashboards keep working through the proxy.
exemption_presets = []

[risk]
block_plaintext_credentials = true

[logging]
retention_days = 7
max_queue = 10000
# What the local activity history keeps. Hostnames can themselves identify people or accounts.
#   "full"      (default) one row per decision: time, hostname, allow/block and reason.
#   "aggregate" per-day counts by decision and reason. Allowed traffic is stored without
#               hostnames; blocked hostnames are kept only as a count per host per day,
#               with no per-event timestamps.
#   "none"      no history is written to disk; decisions are only counted in memory.
# Changing the mode never deletes rows written earlier: old "full" rows stay in
# events.sqlite3, unused, until you delete that file (ordinary deletion, not secure erasure).
history = "full"
